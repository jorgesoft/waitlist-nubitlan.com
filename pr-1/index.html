    <!-- Set the color theme before first paint so there is no flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nubitlan-theme');
          var dark =
            stored === 'dark' ||
            (!stored &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable — fall back to the light theme */
        }
      })();
    </script>
