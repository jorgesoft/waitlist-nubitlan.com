privacy:
  title: "Política de Privacidad"
  lastUpdated: "12 de noviembre de 2025"
  sections:
    - heading: "Información que recopilamos"
      content: |
        Recopilamos información que nos proporcionas directamente cuando te registras en nuestra lista de espera o utilizas nuestra herramienta de evaluación. Esto puede incluir:
        - Nombre y correo electrónico
        - Información sobre tu empresa
        - Respuestas a la evaluación de preparación

    - heading: "Cómo usamos tu información"
      content: |
        Utilizamos la información recopilada para:
        - Enviarte actualizaciones sobre Nubitlan
        - Proporcionarte tu reporte de evaluación personalizado
        - Mejorar nuestros servicios
        - Cumplir con obligaciones legales

    - heading: "Protección de datos"
      content: |
        Implementamos medidas de seguridad técnicas y organizativas apropiadas para proteger tu información personal contra acceso no autorizado, alteración, divulgación o destrucción.

    - heading: "Tus derechos"
      content: |
        Tienes derecho a:
        - Acceder a tu información personal
        - Rectificar datos inexactos
        - Solicitar la eliminación de tus datos
        - Oponerte al procesamiento de tus datos
        - Retirar tu consentimiento en cualquier momento

    - heading: "Contacto"
      content: |
        Si tienes preguntas sobre esta política de privacidad, contáctanos en contacto@nubitlan.com

terms:
  title: "Términos y Condiciones"
  lastUpdated: "12 de noviembre de 2025"
  sections:
    - heading: "Aceptación de términos"
      content: |
        Al acceder y utilizar Nubitlan, aceptas estar sujeto a estos términos y condiciones. Si no estás de acuerdo con alguna parte de estos términos, no debes usar nuestros servicios.

    - heading: "Uso del servicio"
      content: |
        Nubitlan proporciona una herramienta de evaluación de preparación para cumplimiento de la Ley de Protección de Datos Personales de El Salvador. El servicio se proporciona "tal cual" y es solo para fines informativos.

    - heading: "Limitación de responsabilidad"
      content: |
        Los resultados de la evaluación son orientativos y no constituyen asesoría legal. Nubitlan no se hace responsable de decisiones tomadas basándose únicamente en los resultados de la evaluación.

    - heading: "Propiedad intelectual"
      content: |
        Todo el contenido, diseño y funcionalidad de Nubitlan son propiedad de Nubitlan y están protegidos por leyes de propiedad intelectual.

    - heading: "Modificaciones"
      content: |
        Nos reservamos el derecho de modificar estos términos en cualquier momento. Los cambios entrarán en vigor inmediatamente después de su publicación.

    - heading: "Ley aplicable"
      content: |
        Estos términos se rigen por las leyes de El Salvador.
