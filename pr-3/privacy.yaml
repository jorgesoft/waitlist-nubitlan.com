privacy:
  title: "Política de Privacidad de Nubitlan"
  version: "2026-10-11"
  lastUpdated: "11 de octubre de 2026"
  sections:
    - id: "alcance"
      heading: "1. Quiénes somos y a qué aplica esta política"
      content: |
        Nubitlan (NUBITLAN, Sociedad por Acciones Simplificada de Capital Variable, que se abrevia NUBITLAN, S.A.S. de C.V., con domicilio en Apopa, San Salvador, El Salvador) ofrece servicios de ciberseguridad y de cumplimiento de la Ley para la Protección de Datos Personales (LPDP) de El Salvador.

        Esta es la única política de privacidad de Nubitlan. Aplica a:
        - El sitio web nubitlan.com (lista de espera, evaluación de preparación y formularios de contacto).
        - El Portal Nubitlan, la plataforma para clientes (seguridad, cumplimiento LPDP, riesgos, políticas y asistente de IA).
        - TRX Lite (trx.nubitlan.com), la plataforma de capacitación en seguridad.

        Cada producto puede mostrar un resumen, pero este documento es el que rige. Cuando un producto te pide aceptar la política, registra la versión que aceptaste (indicada arriba).

    - id: "roles"
      heading: "2. Cuándo decidimos sobre tus datos y cuándo lo hace tu organización"
      content: |
        - En el sitio web, en tu propia cuenta de TRX Lite y en las cuentas de usuario del portal, Nubitlan es el responsable del tratamiento.
        - Cuando una organización cliente nos contrata, los datos que trata a través de nuestros servicios (por ejemplo, el avance de capacitación de su personal, sus registros LPDP o su registro de riesgos) son de esa organización. Ella es la responsable y Nubitlan actúa como encargado: tratamos esos datos solo para prestarle el servicio, según sus instrucciones y nuestro contrato con ella.

        Si tus datos llegan a nosotros a través de tu organización, también puedes dirigir tus solicitudes a ella.

    - id: "sitio"
      heading: "3. Sitio web nubitlan.com"
      content: |
        - Lista de espera y boletín: tu correo, desde qué parte del sitio te registraste, la fecha y el tipo de navegador. Se guardan en Google Firebase.
        - Evaluación de preparación: tus respuestas y el resultado. Si lo pides, te enviamos el reporte a tu correo.
        - Formularios de contacto: los datos que escribes (nombre, correo, empresa y mensaje). Los procesa Jotform.
        - Analítica: Google Analytics para Firebase registra eventos como empezar o terminar la evaluación. No incluye tu correo ni tus respuestas.
        - Las fuentes tipográficas se cargan desde Google Fonts, que recibe tu dirección IP.

    - id: "portal"
      heading: "4. Portal Nubitlan"
      content: |
        - Cuenta: nombre, correo, organización, rol y los factores de autenticación multifactor que configuras.
        - Datos de tu organización: los dominios y subdominios que Nubitlan registra para ella, y los resultados de los escaneos de lo que esos sistemas exponen a internet (servicios, puertos y versiones). También el registro de riesgos, el estado de las medidas LPDP, las políticas internas y quién confirmó haberlas leído.
        - Concientización: si tu organización contrata el servicio, el portal muestra el avance de capacitación de su personal en TRX Lite (ver la sección 6).
        - Registros de actividad y de seguridad: inicios de sesión, cambios relevantes y quién los hizo.

        Cada organización ve solo sus propios datos. Lo garantiza la base de datos, no solo la interfaz.

    - id: "asistente-ia"
      heading: "5. Asistente de IA del portal"
      content: |
        - Está desactivado hasta que un administrador de tu organización lo activa. Al activarlo, el portal registra quién lo hizo y cuándo.
        - Para responderte, el asistente envía tu mensaje y los datos de tu organización que necesita consultar a nuestro proveedor de modelos de IA, Groq (Estados Unidos).
        - Groq trata esa información con retención cero: no la guarda después de responder y no la usa para entrenar modelos.
        - Tus conversaciones se guardan en el portal para que puedas retomarlas. Solo tú las ves y puedes borrarlas cuando quieras.
        - El asistente no hace cambios por su cuenta: cada cambio que propone necesita tu confirmación, y queda registrado.
        - No tomamos decisiones automatizadas que produzcan efectos jurídicos sobre ti.

    - id: "trx-lite"
      heading: "6. TRX Lite (capacitación)"
      content: |
        - Cuenta: tu correo y, si entras con Google, tu nombre y foto de perfil.
        - Capacitación: los módulos y secciones que completas, tus respuestas y puntajes en los cuestionarios, y los certificados que obtienes.
        - Certificados: son privados salvo que decidas publicarlos. Si publicas uno, tu nombre y la capacitación quedan visibles para cualquiera con el enlace, hasta que lo retires.
        - Comentarios que nos envías: el mensaje, la calificación, la categoría, el módulo y tu correo, para darte seguimiento.
        - Analítica: Google Analytics para Firebase registra eventos como empezar o completar un módulo y el resultado de un cuestionario. No incluye el texto de tus respuestas ni de tus comentarios.

        Tu organización puede ver tu avance. Si tu empresa te inscribió en TRX Lite, sus administradores ven si completaste la capacitación y tu fecha límite. Además, si tu organización contrata el servicio de Concientización de Nubitlan, y tu correo pertenece a un dominio de esa organización o ella registró tu correo específico, verá en el Portal Nubitlan tu nombre, tu correo, los módulos que iniciaste o completaste, las fechas y tus puntajes. Nubitlan registra cada dominio o correo solo con la autorización de la organización, y nunca dominios de correo públicos como gmail.com. El portal lee esta información con un acceso de solo lectura.

    - id: "finalidades"
      heading: "7. Para qué usamos tus datos y con qué base"
      content: |
        - Prestar los servicios que tú o tu organización contrataron: cuentas, escaneos, registros de cumplimiento, capacitación y certificados. Base: el contrato.
        - Enviarte novedades de Nubitlan si te suscribiste. Base: tu consentimiento, que puedes retirar en cualquier momento.
        - Entender de forma agregada cómo se usan los servicios, para mejorarlos. Base: nuestro interés legítimo, con datos que no incluyen el contenido de tus respuestas.
        - Proteger los servicios, investigar incidentes y cumplir obligaciones legales. Base: obligación legal e interés legítimo.

        No vendemos datos personales ni los usamos para publicidad.

    - id: "proveedores"
      heading: "8. Proveedores y transferencias internacionales"
      content: |
        Nos apoyamos en estos proveedores, que tratan datos por cuenta nuestra:
        - Supabase: base de datos y autenticación del portal. Servidores en Estados Unidos.
        - Cloudflare: hospedaje de los sitios y entrega de los videos de capacitación. Red global.
        - Google Firebase y Google Analytics para Firebase: cuentas y avance de TRX Lite, lista de espera y analítica del sitio. Estados Unidos y otras regiones de Google.
        - Groq: modelos de IA del asistente del portal, con retención cero. Estados Unidos.
        - Jotform: formularios de contacto del sitio.

        Esto implica transferir datos fuera de El Salvador, principalmente a Estados Unidos. Lo hacemos con proveedores que se comprometen por contrato a proteger los datos, y solo con los datos necesarios para cada servicio.

    - id: "conservacion"
      heading: "9. Cuánto tiempo conservamos los datos"
      content: |
        - Lista de espera y boletín: hasta que te des de baja.
        - Resultados de la evaluación del sitio: 24 meses.
        - Datos de una organización cliente en el portal: mientras dure el contrato. Al terminar, se eliminan en un plazo de 90 días, salvo lo que la ley nos obligue a conservar.
        - Conversaciones con el asistente de IA: hasta que las borres o hasta que se elimine tu cuenta.
        - Cuenta y avance en TRX Lite: mientras tu cuenta exista. La copia que ve tu organización en el portal se elimina cuando deja de contratar el servicio o cuando deja de registrar tu dominio o correo.
        - Registros de seguridad y de actividad: 12 meses.

    - id: "seguridad"
      heading: "10. Cómo protegemos los datos"
      content: |
        - Cifrado en tránsito en todos nuestros servicios.
        - Aislamiento entre organizaciones en la base de datos.
        - Autenticación multifactor en el portal.
        - Accesos de servicio con el mínimo privilegio: la sincronización de capacitación, por ejemplo, solo puede leer.
        - Pruebas automáticas de los controles de acceso en cada cambio.

        Si ocurre un incidente que afecte tus datos, te avisaremos a ti o a tu organización y a la autoridad, según lo que exige la ley.

    - id: "derechos"
      heading: "11. Tus derechos (ARCO-POL)"
      content: |
        Conforme a la LPDP, puedes ejercer tus derechos de:
        - Acceso: saber qué datos tuyos tenemos.
        - Rectificación: corregir datos inexactos.
        - Cancelación: pedir que los eliminemos.
        - Oposición: oponerte a un tratamiento.
        - Portabilidad: recibir tus datos en un formato de uso común.
        - Olvido: pedir que dejemos de difundir tus datos.
        - Limitación: pedir que restrinjamos su uso.

        Escríbenos a jorge@nubitlan.com indicando qué derecho quieres ejercer. Para proteger tus datos, podemos pedirte que confirmes tu identidad. Responderemos dentro de los plazos que establece la ley.

        Si tus datos llegaron a nosotros a través de tu organización, coordinaremos la respuesta con ella. Si no estás de acuerdo con nuestra respuesta, puedes acudir a la autoridad de control competente.

    - id: "menores"
      heading: "12. Menores de edad"
      content: |
        Nuestros servicios están dirigidos a organizaciones y a sus colaboradores. No están pensados para menores de 18 años.

    - id: "cambios"
      heading: "13. Cambios a esta política"
      content: |
        Cada versión lleva una fecha (arriba). Si un cambio afecta cómo tratamos tus datos, lo anunciaremos en los productos afectados. Cuando un producto lo requiera, te pedirá aceptar la nueva versión.

    - id: "contacto"
      heading: "14. Contacto"
      content: |
        Para preguntas sobre esta política o sobre tus datos: jorge@nubitlan.com.

        Para todo lo demás: contacto@nubitlan.com.

terms:
  title: "Términos y Condiciones"
  lastUpdated: "12 de noviembre de 2025"
  sections:
    - heading: "Aceptación de términos"
      content: |
        Al acceder y utilizar Nubitlan, aceptas estar sujeto a estos términos y condiciones. Si no estás de acuerdo con alguna parte de estos términos, no debes usar nuestros servicios.

    - heading: "Uso del servicio"
      content: |
        Nubitlan proporciona una herramienta de evaluación de preparación para cumplimiento de la Ley de Protección de Datos Personales de El Salvador. El servicio se proporciona "tal cual" y es solo para fines informativos.

    - heading: "Limitación de responsabilidad"
      content: |
        Los resultados de la evaluación son orientativos y no constituyen asesoría legal. Nubitlan no se hace responsable de decisiones tomadas basándose únicamente en los resultados de la evaluación.

    - heading: "Propiedad intelectual"
      content: |
        Todo el contenido, diseño y funcionalidad de Nubitlan son propiedad de Nubitlan y están protegidos por leyes de propiedad intelectual.

    - heading: "Modificaciones"
      content: |
        Nos reservamos el derecho de modificar estos términos en cualquier momento. Los cambios entrarán en vigor inmediatamente después de su publicación.

    - heading: "Ley aplicable"
      content: |
        Estos términos se rigen por las leyes de El Salvador.
