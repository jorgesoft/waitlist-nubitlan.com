<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B8FE8" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- SEO: replaced per route at build time by vite/seo-prerender.ts and
         on navigation by src/components/RouteMeta.tsx. Source: src/lib/seo.ts -->
    <!-- seo:start -->
    <title>Nubitlan — Ciberseguridad y Ley de Protección de Datos en El Salvador</title>
    <!-- seo:end -->

    <!-- Set the color theme before first paint so there is no flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nubitlan-theme');
          var dark =
            stored === 'dark' ||
            (!stored &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable — fall back to the light theme */
        }
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
